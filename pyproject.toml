[project]
name = "mtg-bot"
version = "0.0.1"
description = "A bot that plays Magic: The Gathering and tries to win."
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[project.scripts]
mtg-bot = "mtg_bot.__main__:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=mtg_bot --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
source = ["mtg_bot"]
# Branch coverage is disabled because it forces coverage.py to use
# sys.settrace / sys.monitoring in trace mode, which triggers a Windows
# access-violation crash under Python 3.13 during the simulation sweep
# tests (deep call chain through state_based_actions + _static_bonuses).
# With branch=false, coverage.py uses PEP 669 sys.monitoring in sysmon
# mode — faster and crash-free. Re-enable once coverage gains branch
# support under sysmon.
branch = false
core = "sysmon"

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
