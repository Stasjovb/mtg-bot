<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MTG Bot &mdash; Game Viewer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>

<header class="top-bar">
  <h1 class="brand">MTG Bot</h1>

  <div class="mode-tabs" role="tablist">
    <button type="button" id="tab-watch" class="mode-tab active" role="tab"
            aria-selected="true" aria-controls="panel-watch">Watch</button>
    <button type="button" id="tab-play" class="mode-tab" role="tab"
            aria-selected="false" aria-controls="panel-play">Play</button>
  </div>

  <!-- Watch mode form -->
  <form id="play-form" class="play-form mode-panel" role="tabpanel"
        aria-labelledby="tab-watch" autocomplete="off">
    <label>Seed <input type="number" name="seed" value="0"></label>
    <label>P0 color
      <select name="c1">
        <option value="W">White</option>
        <option value="U">Blue</option>
        <option value="B">Black</option>
        <option value="R" selected>Red</option>
        <option value="G">Green</option>
      </select>
    </label>
    <label>P1 color
      <select name="c2">
        <option value="W">White</option>
        <option value="U">Blue</option>
        <option value="B">Black</option>
        <option value="R">Red</option>
        <option value="G" selected>Green</option>
      </select>
    </label>
    <label>Max turns <input type="number" name="max_turns" value="200" min="1"></label>
    <label>Detail
      <select name="granularity">
        <option value="step" selected>per step</option>
        <option value="priority">per priority pass</option>
      </select>
    </label>
    <label>Show hands
      <select name="reveal">
        <option value="all" selected>both</option>
        <option value="p0">P0 only</option>
        <option value="p1">P1 only</option>
        <option value="none">none</option>
      </select>
    </label>
    <button type="submit">Run game</button>
  </form>

  <!-- Play mode form -->
  <form id="iplay-form" class="play-form mode-panel hidden" role="tabpanel"
        aria-labelledby="tab-play" autocomplete="off">
    <label>Seed <input type="number" id="iplay-seed" value="0"></label>
    <label>Your color
      <select id="iplay-my-color">
        <option value="W">White</option>
        <option value="U">Blue</option>
        <option value="B">Black</option>
        <option value="R" selected>Red</option>
        <option value="G">Green</option>
      </select>
    </label>
    <label>Bot color
      <select id="iplay-bot-color">
        <option value="W">White</option>
        <option value="U">Blue</option>
        <option value="B">Black</option>
        <option value="R">Red</option>
        <option value="G" selected>Green</option>
      </select>
    </label>
    <label>You are
      <select id="iplay-player-id">
        <option value="0">Player 0 (goes first)</option>
        <option value="1">Player 1</option>
      </select>
    </label>
    <label>Max turns <input type="number" id="iplay-max-turns" value="300" min="1"></label>
    <button type="submit">Start game</button>
  </form>

  <div id="status" class="status muted">Pick a seed and colors, then run a game.</div>
</header>

<div id="bottom-controls" class="bottom-controls">
  <div id="scrubber" class="scrubber hidden" aria-label="Snapshot scrubber">
    <div class="scrubber-controls">
      <button type="button" id="btn-first"     title="First snapshot (Home)">&laquo;</button>
      <button type="button" id="btn-prev-turn" title="Previous turn (Shift+Left)">&#8676;T</button>
      <button type="button" id="btn-prev-step" title="Previous step (Alt+Left)">&#8676;S</button>
      <button type="button" id="btn-prev"      title="Previous snapshot (Left)">&lsaquo;</button>
      <button type="button" id="btn-play"      title="Play (Space)">&#9654;</button>
      <button type="button" id="btn-next"      title="Next snapshot (Right)">&rsaquo;</button>
      <button type="button" id="btn-next-step" title="Next step (Alt+Right)">S&#8677;</button>
      <button type="button" id="btn-next-turn" title="Next turn (Shift+Right)">T&#8677;</button>
      <button type="button" id="btn-last"      title="Last snapshot (End)">&raquo;</button>
    </div>
    <input type="range" id="scrub-slider" min="0" max="0" value="0" step="1" aria-label="Snapshot slider">
    <div class="scrubber-readout">
      <span id="scrub-label">&mdash;</span>
      <span id="scrub-counter" class="muted">0 / 0</span>
    </div>
  </div>

  <div id="phase-tracker" class="phase-tracker hidden" aria-label="Phase tracker">
    <ol id="phase-list" class="phase-list"></ol>
  </div>
</div>

<!-- Interactive play: decision panel (replaces the scrubber in play mode) -->
<div id="decision-panel" class="decision-panel hidden" aria-label="Decision panel" aria-live="polite">
  <div id="decision-waiting" class="decision-waiting hidden">
    <span class="decision-spinner"></span> Bot is thinking&hellip;
  </div>
  <div id="decision-body" class="decision-body hidden">
    <div id="decision-prompt" class="decision-prompt"></div>
    <div id="decision-options" class="decision-options"></div>
  </div>
</div>

<main id="board" class="board hidden" aria-label="Game board">
  <section class="player-row opponent" id="row-p1"></section>
  <section class="stack-row" id="row-stack" aria-label="Stack"></section>
  <section class="player-row you" id="row-p0"></section>
</main>

<aside class="right-col" aria-label="Side panel">
  <section id="search-panel" class="search-panel hidden"
           aria-label="Decision">
    <header class="search-header">
      <h2>Decision</h2>
      <button type="button" id="search-toggle" class="search-toggle"
              title="Toggle decision detail">&minus;</button>
    </header>
    <div id="search-body" class="search-body">
      <div class="search-meta">
        <span id="search-chosen" class="search-chosen"></span>
        <span id="search-budget" class="muted"></span>
      </div>
      <table class="search-table">
        <thead>
          <tr>
            <th>Action</th>
            <th class="num">Visits</th>
            <th class="num">Q</th>
            <th class="num">Prior</th>
            <th class="num">Leaf V</th>
          </tr>
        </thead>
        <tbody id="search-rows"></tbody>
      </table>
    </div>
  </section>
  <aside id="log-panel" class="log-panel hidden" aria-label="Game log">
    <h2>Log</h2>
    <div id="log-body" class="log-body"></div>
  </aside>
</aside>

<svg id="combat-overlay" class="combat-overlay" aria-hidden="true">
  <defs>
    <marker id="arrow-head-attack" markerWidth="10" markerHeight="10"
            refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ff9852"/>
    </marker>
    <marker id="arrow-head-block" markerWidth="10" markerHeight="10"
            refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6fa8ff"/>
    </marker>
  </defs>
</svg>

<div id="card-preview" class="card-preview" hidden aria-hidden="true"></div>

<div id="zone-modal" class="zone-modal hidden" role="dialog" aria-modal="true"
     aria-labelledby="zone-modal-title" hidden>
  <div class="zone-modal-inner">
    <header class="zone-modal-header">
      <span id="zone-modal-title">Zone</span>
      <button type="button" id="zone-modal-close" title="Close (Esc)">&times;</button>
    </header>
    <div id="zone-modal-cards" class="zone-modal-cards"></div>
  </div>
</div>

<!-- Decision modal: used for discard, sacrifice, mode choice, X, mana, yes/no, etc. -->
<div id="decision-modal" class="zone-modal hidden" role="dialog" aria-modal="true"
     aria-labelledby="decision-modal-title" hidden>
  <div class="zone-modal-inner decision-modal-inner">
    <header class="zone-modal-header">
      <span id="decision-modal-title">Choose</span>
    </header>
    <div id="decision-modal-body" class="decision-modal-body"></div>
  </div>
</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
